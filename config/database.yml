default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: job_app_tracker_development

test:
  <<: *default
  database: job_app_tracker_test

production:
  <<: *default
  database: job_app_tracker_production
  username: job_app_tracker
  password: <%= ENV["JOB_APP_TRACKER_DATABASE_PASSWORD"] %>
